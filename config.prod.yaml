      keywords: [smartphone, cuffie bluetooth, smartwatch, aspirapolvere robot, power bank, tablet, auricolari, caricatore, telecamera, lampada led, utensili, giocattoli, orologio, zaino, accessori auto]
    # Maxi Sport IT (Awin 9923): sport, scarpe e abbigliamento, approvato il 15/11/2026
    # Moulinex IT (Awin 9450): piccoli elettrodomestici da cucina, attivo dal 13/11/2026
