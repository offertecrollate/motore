# Configurazione del motore su GitHub. I codici veri arrivano dai segreti (envsubst).
database: prezzi.db
site:
  out_dir: site
  domain: offertecrollate.ch
  owner:
    name: ${OWNER_NAME}         # segreto OWNER_NAME
    address: ${OWNER_ADDRESS}   # segreto OWNER_ADDRESS
    email: offertecrollate@gmail.com
  hero_image: assets/hero.jpg
  chart_days: 90
  update_in_test: true   # in prova il sito si aggiorna lo stesso (i canali no)
  countries:
    it:
      domain: offertecrollate.it
      out_dir: site_it
      langs:
      - it
      sections:
      - id: tech
        name:
          it: Informatica
        sources:
        - awin_acer_it
    ch:
      domain: offertecrollate.ch
      out_dir: site_ch
      langs:
      - it
      - de
      - fr
      sections: []
countries:
  ch:
    rules:
      max_site_only: 5000     # in pratica nessun limite
      history_days: 30
      min_history: 7
      offer_pct: 30
      error_pct: 80     # "errore di prezzo" solo da -80% (decisione di Giuseppe)
      min_price: 20
      trust_old_price: false
      repost_after_days: 30
      max_posts_per_run: 15     # canali: solo le 15 più forti di tutti i negozi affiliati
      site_min_pct: 30
      min_post_pct: 60          # canali: dal -60% o errori di prezzo (17/11/2026)          # sito: tutte le offerte dal 30% in su
      pause_between_posts: 75   # un post ogni 75 secondi: 30 post stanno in circa 40 minuti
    sources:
    - name: aliexpress_ch
      type: aliexpress
      app_key: ${ALI_APP_KEY}
      app_secret: ${ALI_APP_SECRET}
      tracking_id: offertecrollate
      country: CH
      currency: CHF
      language: IT
      min_discount: 30
      pages: 2
      site_old_price: true    # sul sito subito, con il prezzo pieno dichiarato da AliExpress
      affiliate: true         # link affiliato: anche su Telegram e Facebook
      keywords: [smartphone, cuffie bluetooth, smartwatch, aspirapolvere robot, power bank, tablet, auricolari, caricatore, telecamera, lampada led, utensili, giocattoli, orologio, zaino, accessori auto]
    - name: awin_sodeal_ch
      type: feed
      preset: awin
      currency: CHF
      publish: false
      awin_list: https://ui.awin.com/productdata-darwin-download/publisher/3152592/${AWIN_FEED_KEY}/1/feedList
      awin_feed_id: '84531'
    - name: google_natkina_ch
      type: feed
      preset: google
      currency: CHF
      publish: false
      shop: Natkina
      awin_list: https://ui.awin.com/productdata-darwin-download/publisher/3152592/${AWIN_FEED_KEY}/1/feedList
      awin_feed_id: F4313
    - name: shopify_natkina_ch
      type: shopify
      url: https://natkina.com
      shop: Natkina
      currency: CHF
      max_pages: 20
      min_discount: 30
      site_only: true
    # Amazon.it anche sul sito svizzero (Amazon.it spedisce in Svizzera molti prodotti): solo sito, con l'avviso
    # "controlla la spedizione in Svizzera nel carrello"; sui canali escono già dalla parte italiana
    - name: amazon_it
      type: keepa
      api_key: ${KEEPA_KEY}
      domain: it
      tag: offertecrolla-21
      min_discount: 30
      min_price: 1
      quality: true           # 16/11: troppe "cazzate" -> solo prodotti con buone recensioni e venduti
      max_sales_rank: 50000
      min_rating: 38
      # categorie che vendono di più su Amazon (decisione di Giuseppe 16/11/2026), solo prodotti molto venduti
      focus:
        - {name: elettronica e TV, cats: [412609031], max_rank: 15000}
        - {name: informatica iPad monitor, cats: [425916031], max_rank: 15000}
        - {name: PS5 e videogiochi, cats: [412603031], max_rank: 10000}
        - {name: alimentari merendine carta igienica, post_pct: 40, cats: [6198082031], max_rank: 10000, min_discount: 25}
        - {name: cioccolatini, post_pct: 40, cats: [6198082031], title: cioccolat, max_rank: 30000, min_discount: 25}
        - {name: caramelle e dolci, post_pct: 40, cats: [6198082031], title: caramell, max_rank: 30000, min_discount: 25}
        - {name: bevande, post_pct: 40, cats: [6198082031], title: bevand, max_rank: 30000, min_discount: 25}
        - {name: caffè e capsule, post_pct: 40, cats: [6198082031], title: caff, max_rank: 30000, min_discount: 25}
        - {name: robot tagliaerba, cats: [635016031], title: tagliaerba, max_rank: 50000, min_discount: 25}
        - {name: casa e cucina, cats: [524015031], max_rank: 8000}
        - {name: salute e cura persona, cats: [1571289031], max_rank: 8000}
        - {name: Black Friday prodotti costosi, cats: [412609031, 425916031, 412603031, 524015031], max_rank: 60000, min_price: 150, min_discount: 35}
      exclude_media: false    # anche libri, Kindle, musica e film
      max_discount: 95        # anche i possibili errori sopra l'80%
      max_check: 250          # prodotti di cui leggere il prezzo vero Amazon (3 gettoni l'uno)
      pages: 4                # tante offerte Amazon sul sito (decisione 15/11/2026): 600 candidati, 20 gettoni
      site_only: true
      site_old_price: true
      max_site: 350
    # Sedusia CH (Awin 19024, negozio per adulti): categoria "Adulti 18+" con conferma età, fuori da Google,
    # mai su Facebook, su Telegram con immagine neutra "18+" (decisione di Giuseppe del 14/11/2026)
    - name: awin_sedusia_ch
      type: feed
      preset: awin
      currency: CHF
      shop: Sedusia
      adult: true
      site_old_price: true
      min_discount: 30
      max_site: 40
      awin_list: https://ui.awin.com/productdata-darwin-download/publisher/3152592/${AWIN_FEED_KEY}/1/feedList
      awin_advertiser_id: '19024'
    # Electrolux CH (Awin 31407): accessori, pulizia e ricambi
    - name: awin_electrolux_ch
      type: feed
      preset: awin
      currency: CHF
      shop: Electrolux
      site_old_price: true
      min_discount: 15
      max_site: 60
      awin_list: https://ui.awin.com/productdata-darwin-download/publisher/3152592/${AWIN_FEED_KEY}/1/feedList
      awin_advertiser_id: '31407'
    publishers:
    - type: facebook_page
      post_tag: '#ADV'
      label: Facebook Svizzera
      site_url: https://offertecrollate.ch
      lang: it
      page_id: '1402093839660293'
      page_token: ${FB_PAGE_TOKEN}
